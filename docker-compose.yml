services:
  life-rpg:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    environment:
      TZ: America/Sao_Paulo
      # Optional AI (Marco 7): the key lives in ./.env on the server (never in the repository).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LIFE_RPG_AI_DAILY_LIMIT: ${LIFE_RPG_AI_DAILY_LIMIT:-30}
